<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BizPilot AI</title>
    <meta name="description" content="BizPilot AI helps small businesses plan, generate, and approve marketing content with AI — from a first business profile to a scheduled content plan, in minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BizPilot AI" />
    <meta property="og:description" content="AI-powered marketing content planning and approval for small businesses." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BizPilot AI" />
    <meta name="twitter:description" content="AI-powered marketing content planning and approval for small businesses." />
    <script>
      // Blocking, pre-hydration theme application to prevent a flash of the
      // wrong theme. Mirrors the logic in src/shared/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('bizpilot-ai:theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (_error) {
          /* localStorage unavailable (private mode, etc.) - default light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
