<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>BizPilot AI</title>
    <script>
      // Blocking, pre-hydration theme application to prevent a flash of the
      // wrong theme. Mirrors the logic in src/shared/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('bizpilot-ai:theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var isDark =
            theme === 'dark' ||
            (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (_error) {
          /* localStorage unavailable (private mode, etc.) - default light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Application entry point (src/main.tsx) is added in the next phase. -->
  </body>
</html>
